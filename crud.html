<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudStock - Inventario</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <h1>CloudStock</h1>

    <p>Gestión de inventario</p>

    <div class="contenedor">

        <h2>Agregar producto</h2>

        <input type="text" id="nombre" placeholder="Nombre del producto">

        <input type="number" id="precio" placeholder="Precio">

        <input type="number" id="stock" placeholder="Stock">

        <button onclick="agregarProducto()">
            Agregar producto
        </button>

        <h2>Productos</h2>

        <input
            type="text"
            id="buscar"
            placeholder="Buscar producto..."
            onkeyup="buscarProducto()"
        >

        <table>

            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody id="tablaProductos">
            </tbody>

        </table>

    </div>


    <script>

        const SUPABASE_URL =
            "https://lqhxhtlgftncmiatrxaj.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_vGaD6fO0rk7_c_L95QFo8Q_V6A4jsql";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        // Cargar productos al abrir la página

        async function cargarProductos() {

            const { data, error } =
                await supabaseClient
                    .from("productos")
                    .select("*")
                    .order("id", { ascending: true });


            if (error) {

                console.error(error);

                alert("Error al cargar los productos.");

                return;
            }


            const tabla =
                document.getElementById("tablaProductos");

            tabla.innerHTML = "";


            data.forEach(function(producto) {

                crearFila(producto);

            });

        }


        // Crear fila de producto

        function crearFila(producto) {

            const tabla =
                document.getElementById("tablaProductos");

            const fila =
                document.createElement("tr");

            fila.setAttribute("data-id", producto.id);


            fila.innerHTML = `

                <td>${producto.nombre}</td>

                <td>$${producto.precio}</td>

                <td>${producto.stock}</td>

                <td>

                    <button onclick="editarProducto(${producto.id})">
                        Editar
                    </button>

                    <button onclick="eliminarProducto(${producto.id})">
                        Eliminar
                    </button>

                </td>

            `;


            tabla.appendChild(fila);

        }


        // Agregar producto

        async function agregarProducto() {

            const nombre =
                document.getElementById("nombre").value.trim();

            const precio =
                document.getElementById("precio").value;

            const stock =
                document.getElementById("stock").value;


            if (nombre === "" || precio === "" || stock === "") {

                alert("Completa todos los campos.");

                return;

            }


            if (precio < 0 || stock < 0) {

                alert("El precio y el stock no pueden ser negativos.");

                return;

            }


            const { error } =
                await supabaseClient
                    .from("productos")
                    .insert([

                        {
                            nombre: nombre,
                            precio: Number(precio),
                            stock: Number(stock)
                        }

                    ]);


            if (error) {

                console.error(error);

                alert("Error al guardar el producto.");

                return;

            }


            document.getElementById("nombre").value = "";

            document.getElementById("precio").value = "";

            document.getElementById("stock").value = "";


            cargarProductos();

        }


        // Editar producto

        async function editarProducto(id) {

            const { data, error } =
                await supabaseClient
                    .from("productos")
                    .select("*")
                    .eq("id", id)
                    .single();


            if (error) {

                alert("Error al obtener el producto.");

                return;

            }


            const nuevoNombre =
                prompt("Nuevo nombre:", data.nombre);


            if (nuevoNombre === null || nuevoNombre.trim() === "") {

                return;

            }


            const nuevoPrecio =
                prompt("Nuevo precio:", data.precio);


            if (nuevoPrecio === null || nuevoPrecio === "") {

                return;

            }


            const nuevoStock =
                prompt("Nuevo stock:", data.stock);


            if (nuevoStock === null || nuevoStock === "") {

                return;

            }


            if (nuevoPrecio < 0 || nuevoStock < 0) {

                alert("El precio y el stock no pueden ser negativos.");

                return;

            }


            const { error: updateError } =
                await supabaseClient
                    .from("productos")
                    .update({

                        nombre: nuevoNombre.trim(),

                        precio: Number(nuevoPrecio),

                        stock: Number(nuevoStock)

                    })
                    .eq("id", id);


            if (updateError) {

                console.error(updateError);

                alert("Error al actualizar el producto.");

                return;

            }


            cargarProductos();

        }


        // Eliminar producto

        async function eliminarProducto(id) {

            const confirmar =
                confirm("¿Seguro que quieres eliminar este producto?");


            if (!confirmar) {

                return;

            }


            const { error } =
                await supabaseClient
                    .from("productos")
                    .delete()
                    .eq("id", id);


            if (error) {

                console.error(error);

                alert("Error al eliminar el producto.");

                return;

            }


            cargarProductos();

        }


        // Buscar producto

        function buscarProducto() {

            const texto =
                document
                    .getElementById("buscar")
                    .value
                    .toLowerCase();


            const filas =
                document.querySelectorAll(
                    "#tablaProductos tr"
                );


            filas.forEach(function(fila) {

                const nombre =
                    fila.cells[0]
                        .textContent
                        .toLowerCase();


                if (nombre.includes(texto)) {

                    fila.style.display = "";

                } else {

                    fila.style.display = "none";

                }

            });

        }


        // Iniciar

        cargarProductos();

    </script>

</body>

</html>
